[package]
name = "rust-layered-http"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_layered_http"
path = "src/lib.rs"

[[bin]]
name = "rust-layered-http"
path = "src/main.rs"

[dependencies]
jsonwebtoken = "9"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
